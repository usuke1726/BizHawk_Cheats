function main(s){
const isHeader = (el) => {
    if(el.tagName !== "TABLE") return false;
    const a = el.getElementsByTagName("font");
    if(!a || a.length !== 1) return false;
    const b = a[0].getElementsByTagName("a")
    if(!a || a.length !== 1) return false;
    return true;
};
const children = [...document.body.childNodes];
const el = children.filter(el => el.tagName === "TABLE").find(el => el.innerText.trim() === s);
const IDX = children.indexOf(el);
const el2 = children.find((el, idx) => idx>IDX && isHeader(el));
const IDX2 = children.indexOf(el2);
return [...Array(IDX2-IDX).keys()].map(i => i+IDX).map(i => children[i].nodeType === Node.TEXT_NODE ? children[i].textContent.trim() : children[i].outerHTML).join("\n");
}
